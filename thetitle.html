<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Dual Heat — Logo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&display=swap" rel="stylesheet">

  <style>
    @font-face {
      font-family: "DSEG7";
      src: url("https://cdn.jsdelivr.net/npm/dseg@0.46.0/fonts/DSEG7-Classic/DSEG7Classic-Bold.woff2")
        format("woff2");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
    }

    .logo {
      margin: 0;
      padding: 24px;
      text-align: center;
      font-size: clamp(60px, 16vw, 180px);
      line-height: 0.95;
    }

    .logo .the {
      display: block;
      margin-bottom: 0.2em;
      font-family: "Playfair Display", serif;
      font-size: 0.3em;
      font-weight: 900;
      letter-spacing: 0.3em;
      text-indent: 0.3em;
      line-height: 1.2;
    }

    .logo .dual {
      display: block;
      font-family: "Playfair Display", serif;
      font-weight: 900;
      letter-spacing: 0.01em;
    }

    .logo .heat {
      display: block;
      margin-top: 0.12em;
      font-family: "DSEG7", monospace;
      font-size: 0.88em;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
  </style>
</head>

<body>
  <h1 class="logo" aria-label="The Dual Heat">
    <span class="the" aria-hidden="true">THE</span>
    <span class="dual" aria-hidden="true">DUAL</span>
    <span class="heat" aria-hidden="true">HEAt</span>
  </h1>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dual Heat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fontsource-dseg7-classic/5.3.0/index.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: serif;
      background: #000;
    }

    .the {
      margin: 0 0 8px;
      font-family: "Playfair Display", serif;
      font-weight: 900;
      font-size: 20px;
      letter-spacing: 0.42em;
      text-indent: 0.42em;
      text-transform: uppercase;
      color: #fff;
    }

    h1 {
      margin: 0;
      font-size: clamp(60px, 16vw, 180px);
      font-weight: normal;
      text-transform: uppercase;
      color: #fff;
      line-height: 0.95;
    }

    h1 .dual {
      font-family: "Playfair Display", serif;
      font-weight: 900;
      letter-spacing: 0.01em;
    }

    h1 .heat {
      font-family: "DSEG7 Classic", monospace;
      font-weight: 700;
      font-size: 0.88em;
      letter-spacing: 0.04em;
      color: #fff;
    }

    p {
      margin: 28px 0 0;
      font-family: "Playfair Display", serif;
      font-weight: 900;
      font-size: 13px;
      letter-spacing: 0.50em;
      text-indent: 0.50em;
      text-transform: uppercase;
      color: #fff;
    }

    .buttons {
      display: flex;
      gap: 14px;
      margin-top: 18px;
    }

    .button {
      display: inline-block;
      padding: 12px 22px;
      border: 2px solid #fff;
      background: transparent;
      font-family: "Playfair Display", serif;
      font-weight: 900;
      font-size: 13px;
      letter-spacing: 0.24em;
      text-indent: 0.24em;
      text-transform: uppercase;
      color: #fff;
      text-decoration: none;
      cursor: pointer;
    }

    .button:hover,
    .button:focus-visible {
      background: #fff;
      color: #000;
    }
  </style>
</head>
<body>

  <p class="the">The</p>

  <h1>
    <span class="dual">Dual</span><br>
    <span class="heat">Heat</span>
  </h1>

  <p>Magazine of Mind and Body</p>
  <p></p>

<div class="buttons">
  <a class="button" href="about.html">About</a>
  <a class="button" href="submit.html">Submit</a>
</div>

</body>
</html>
